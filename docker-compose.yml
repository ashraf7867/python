version: '3.8'

services:
  flask-app:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: task-manager-app
    ports:
      - "5000:5000"
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=production
      - FLASK_DEBUG=0
    volumes:
      # Mount for development (comment out for production)
      - .:/app
      # Named volume for persistent data (if needed)
      - app_data:/app/data
    restart: unless-stopped
    networks:
      - flask-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Add Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: task-manager-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro  # For SSL certificates
    depends_on:
      - flask-app
    restart: unless-stopped
    networks:
      - flask-network

  # Optional: Add Redis for session management
  redis:
    image: redis:7-alpine
    container_name: task-manager-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - flask-network
    command: redis-server --appendonly yes

volumes:
  app_data:
  redis_data:

networks:
  flask-network:
    driver: bridge